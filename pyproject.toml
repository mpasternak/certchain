[project]
name = "certchain"
version = "0.1.0"
description = "Build and verify certificate fullchains for nginx: orders leaf + intermediates, fetches missing ones via AIA, checks key, trust and hostname."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michał Pasternak", email = "michal.dtz@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "rich>=13",
    "cryptography>=42",
    "certifi",
]
keywords = ["ssl", "tls", "certificate", "x509", "nginx", "fullchain", "intermediate", "aia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/mpasternak/certchain"
Repository = "https://github.com/mpasternak/certchain"
Issues = "https://github.com/mpasternak/certchain/issues"

[project.scripts]
certchain = "certchain:cli"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["certchain.py"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
